{% extends 'admin_dashboard/base.html' %}

{% block page_title %}Delete Project{% endblock %}

{% block content %}
<div class="card panel-card">
    <div class="card-body">
        <p>Delete <strong>{{ object.title }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Confirm</button>
            <a class="btn btn-outline-light" href="{% url 'admin_dashboard:projects' %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
