{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Portfolio{% endblock %}</title>
    <meta name="description" content="Modern personal portfolio showcasing projects, services, and writing." />
    <meta name="keywords" content="portfolio, developer, designer, projects" />
    <meta name="author" content="{{ profile.name|default:'Portfolio' }}" />
    <meta property="og:title" content="{{ profile.name|default:'Portfolio' }}" />
    <meta property="og:description" content="{{ profile.bio|default:'Modern portfolio site' }}" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />
    <link href="{% static 'css/portfolio.css' %}" rel="stylesheet" />
</head>
<body class="portfolio-body">
    <div id="page-loader" class="page-loader">
        <div class="spinner-border text-light" role="status" aria-hidden="true"></div>
    </div>

    {% include 'portfolio/partials/navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'portfolio/partials/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="{% static 'js/portfolio.js' %}"></script>
</body>
</html>
